name: check
on:
  pull_request:
  merge_group:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check
        run: |
          if [ -f FAIL ]; then echo "FAIL file present"; exit 1; fi
          if [ "${{ github.event_name }}" = merge_group ]; then sleep 180; fi
