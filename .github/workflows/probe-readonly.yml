name: probe-readonly
on:
  workflow_dispatch:
    inputs:
      pr:
        description: pull request number
        required: true
permissions:
  contents: read
  pull-requests: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: |
          set +e
          o=${GITHUB_REPOSITORY%/*}; r=${GITHUB_REPOSITORY#*/}
          id=$(gh api graphql -f query='query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){pullRequest(number:$n){id}}}' -f o="$o" -f r="$r" -F n="$PR" --jq .data.repository.pullRequest.id)
          echo "== enqueue"; gh api graphql -f query='mutation($id:ID!){enqueuePullRequest(input:{pullRequestId:$id}){mergeQueueEntry{position state}}}' -f id="$id"; echo "exit=$?"
          echo "== dequeue"; gh api graphql -f query='mutation($id:ID!){dequeuePullRequest(input:{id:$id}){mergeQueueEntry{position state}}}' -f id="$id"; echo "exit=$?"
          echo "== read"; gh api graphql -f query='query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){pullRequest(number:$n){isInMergeQueue mergeQueueEntry{position state estimatedTimeToMerge}}}}' -f o="$o" -f r="$r" -F n="$PR"; echo "exit=$?"
